[package]
name = "s3d-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core 3D GIS & Map Rendering Engine (Desktop & WASM)"

[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
# GPU & 3D Math
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

# GIS & Geometry
geojson = { workspace = true }
earcutr = { workspace = true }
tiny-skia = { workspace = true }

# Solar & Time
chrono = { workspace = true }
web-time = { workspace = true }

# Serialization & Logging
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# Image & Data Formats
image = { workspace = true }
lerc-rs = { workspace = true }
flate2 = { workspace = true }

# Optional UI integration
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { workspace = true }
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
ehttp = { workspace = true }
getrandom = { workspace = true }
console_error_panic_hook = { workspace = true }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[dev-dependencies]
pollster = "0.4"
env_logger = "0.11"
eframe = { workspace = true, default-features = true, features = ["wgpu"] }
egui-phosphor = { workspace = true }

[lib]
name = "s3d_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"
