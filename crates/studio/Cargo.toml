[package]
name = "s3d-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Full-fledged ArcGIS Pro-like 3D GIS Application"

[dependencies]
s3d-core = { workspace = true, features = ["egui"] }
s3d-control = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-phosphor = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, default-features = true, features = ["wgpu"] }
rfd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, default-features = false, features = ["wgpu", "default_fonts"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[[bin]]
name = "s3d-studio"
path = "src/main.rs"
